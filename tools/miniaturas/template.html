<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #05070a;
    --lime: #b6ff3c;
    --blue: #1f6fff;
    --orange: #ff5a1f;
    --hud-line: rgba(182, 255, 60, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 720px;
    background: var(--bg);
    overflow: hidden;
    font-family: "Arial Narrow", "Eurostile", Arial, sans-serif;
  }
  .frame {
    position: relative;
    width: 1280px;
    height: 720px;
    background:
      radial-gradient(circle at 80% 20%, rgba(31,111,255,0.25), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(182,255,60,0.15), transparent 40%),
      var(--bg);
  }
  /* split-screen divider */
  .divider {
    position: absolute;
    top: 0;
    left: 50%;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, var(--lime), var(--blue));
    box-shadow: 0 0 24px var(--lime);
    transform: translateX(-2px);
  }
  /* scanlines */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
  }
  .hud-corner {
    position: absolute;
    width: 46px;
    height: 46px;
    border: 3px solid var(--lime);
  }
  .hud-corner.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .hud-corner.tr { top: 28px; right: 28px; border-left: none; border-bottom: none; }
  .hud-corner.bl { bottom: 28px; left: 28px; border-right: none; border-top: none; }
  .hud-corner.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .rank {
    position: absolute;
    top: 48px;
    left: 60px;
    color: var(--lime);
    font-size: 26px;
    letter-spacing: 4px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .series {
    position: absolute;
    bottom: 220px;
    left: 60px;
    right: 60px;
    color: var(--orange);
    font-size: 30px;
    letter-spacing: 6px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .title {
    position: absolute;
    bottom: 90px;
    left: 60px;
    right: 60px;
    color: #ffffff;
    font-size: 74px;
    line-height: 1.02;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(182,255,60,0.35);
  }
  .signal {
    position: absolute;
    bottom: 40px;
    left: 60px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
  }
  .signal span {
    display: block;
    width: 14px;
    background: var(--lime);
  }
  .signal span:nth-child(1) { height: 14px; }
  .signal span:nth-child(2) { height: 22px; }
  .signal span:nth-child(3) { height: 30px; }
  .signal span:nth-child(4) { height: 38px; }
  .signal span:nth-child(5) { height: 46px; }

  .duration {
    position: absolute;
    bottom: 40px;
    right: 60px;
    color: var(--blue);
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="divider"></div>
    <div class="rank" data-field="rank">PRESTIGE 01</div>
    <div class="series" data-field="series">MOST WANTED SESSIONS</div>
    <div class="title" data-field="title">TACTICAL DNB<br>MIX</div>
    <div class="signal">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="duration" data-field="duration">45 MIN</div>
    <div class="scanlines"></div>
  </div>
</body>
</html>
